name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    # Linux only for now: Graphviz (pygraphviz) and Node (cytoscape.js) are system requirements
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Install the JavaScript layouts (cytoscape.js, graphology, Reagraph)
      working-directory: src/layout_benchmark/js
      run: npm ci

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Run tests
      # the external tools (MetaCarto, sbml2map, ecmapper, automatic_layout_following_our_rules, small-pathway-layout,
      # SBMLNetwork) need their own environments in .tools/, not set up here: their layouts are skipped
      run: uv run --extra tests pytest
