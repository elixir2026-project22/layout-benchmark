# The layout benchmark's models: where each comes from, sets, reference layouts, links and credits (see
# src/layout_benchmark/manifest.py for the format).
#   uv run layout-benchmark fetch benchmark.yaml          # downloads into data/<set>/, writes data/manifest.lock.json
#   uv run layout-benchmark run benchmark.yaml -o results/all
# The gallery's entries are written by scripts/gallery_manifest.py.
