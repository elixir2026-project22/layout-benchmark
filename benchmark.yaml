  - name: Inborn metabolic disorders (IMD maps)
    description: >-
      Escher maps of the pathways of inborn metabolic disorders, drawn by hand on the Recon3D model; each map is
      its reference layout, and its reactions and metabolites are the model.
    models: "https://github.com/elixir2026-project22/data_shared/blob/main/IMD Maps/**/*.json"
    convert: escher
    credit: "Maps: jadziaann, data_shared (BioHackathon 2026, project 22)"

  - name: Stress Knowledge Map (PSS)
    description: >-
      Plant stress signalling, from the Stress Knowledge Map (skm.nib.si), with model fixes; public data,
      Arabidopsis thaliana.
    page: https://skm.nib.si
    credit: "Stress Knowledge Map, CC BY-NC 4.0"
    licence: https://creativecommons.org/licenses/by-nc/4.0/
    models:
      - https://github.com/elixir2026-project22/data_shared/blob/main/NIB/Small_pathways/ja/sbml/model-with-model-fixes.xml
      - https://github.com/elixir2026-project22/data_shared/blob/main/NIB/Small_pathways/sa/sbml/model-with-model-fixes.xml
      - https://github.com/elixir2026-project22/data_shared/blob/main/NIB/Big_pathways/pss/sbml/model-with-model-fixes.xml

  - name: BRENDA pathways
    description: >-
      Pathways of BRENDA's pathway map; the reference is the pathway on that map (BRENDA, CC BY 4.0), read from
      ecmapper's export of it.
    models: https://github.com/elixir2026-project22/data_shared/blob/main/brenda_*.xml
    reference: https://github.com/elixir2026-project22/ecmapper/blob/main/BRENDAmap/BRENDA_map_reactions.json
    reference_kind: brenda-map
    credit: "Reference map: BRENDA pathway map, CC BY 4.0"
    licence: https://www.brenda-enzymes.org/copy.php

  - name: Reactome
    description: A Reactome pathway; its SBML has Reactome's diagram as an SBML Layout, the reference layout.
    models:
      - url: https://github.com/elixir2026-project22/data_shared/blob/main/R-HSA-77289.sbml
        page: https://reactome.org/content/detail/R-HSA-77289
    reference: layout

  - name: Genome-scale and core models
    models:
      - https://github.com/elixir2026-project22/data_shared/blob/main/e_coli_core.sbml
      - https://github.com/elixir2026-project22/data_shared/blob/main/e_coli_iCH360.sbml
      - https://github.com/elixir2026-project22/data_shared/blob/main/Mycoplasma_genitalium-Opt243273_1.sbml
      - name: iML1515
        url: http://bigg.ucsd.edu/static/models/iML1515.xml
        files: [http://bigg.ucsd.edu/static/models/iML1515.json]
        page: http://bigg.ucsd.edu/models/iML1515
